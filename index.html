<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1 class="timer">
            <div id="hour">00</div>
            <span>:</span>
            <div id="min">00</div>
            <span>:</span>
            <div id="sec">00</div>
            <span>:</span>
            <div id="milisec">00</div>
        </h1>

        <div class="buttons">
            <button id="resetb">Reset</button>
            <button id="startb" class="active-button">Start</button>
            <button id="pauseb">Pause</button>
        </div>
    </main>
</body>
</html>
